<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch08 - index01.html</h1>

    <script>
      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터받침대", price: 15000, stock: 12 },
      ];

      console.log("-------------1. for문으로 반복-------------");
      for (let i = 0; i < products.length; i++) {
        console.log(products[i].name);
      }

      console.log("-------------2. forEach문으로 반복-------------");
      // 1. forEach 구문은 안에서 콜백을 부를때 항상 (요소 , 인덱스 , 배열) 이 3개를 순서대로 넘겨줌.
      // 2. 매개변수를 하나만 적으면 요소만 받고 2개만 적으면 인덱스 까지 받음. 이름은 자유 , 순서는 고정.
      products.forEach((p) => {
        console.log(`${p.name}`);
      });

      console.log("-------------3. forEach문 두번째 매개변수는 인덱스 -------------");
      products.forEach((p, i) => {
        console.log(`${i + 1} ${p.name}`);
      });

      console.log("-------------4. forEach문은 돌려주는 값이 없음. -------------");
      const result = products.forEach((p) => p.name);
      console.log(result); // undefined 출력. forEach는 돌려주는 값이 없음.

      console.log("----------------5.합계구하기----------------");
      let totalStock = 0;
      products.forEach((p) => {
        totalStock = totalStock + p.stock;
      });
      console.log(totalStock);

      console.log("----------------전체합계 구하기----------------");
      let totalPrice = 0;
      products.forEach((p) => {
        totalPrice += p.stock * p.price;
      });
      console.log(totalPrice);
    </script>
  </body>
</html>
