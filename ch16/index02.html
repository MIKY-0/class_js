<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../reset.css" />

    <style>
      /* 1단계 : 리셋 + 전역 스타일 */
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        padding: 20px;
      }

      /* 2단계 : 레이아웃 (큰 틀 배치) */
      .banner-container {
        display: flex;
        align-items: center;
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
      }
      .image-wrapper {
        flex: 1;
        height: 200px;

        /* 자식 이미지의 position을 absolute로 줄것임. --> 지금 이곳이 자식에게 기준이 됨.
        이게 없으면 이미지가 바디 기준으로 놓여 배너 밖으로 튀어나감. */
        position: relative;

        /* 영역 밖으로 나온 부분은 잘라서 보이지 않게함. */
        overflow: hidden;
      }
      .image-wrapper img {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* 3단계 : 컴포넌트 스타일 */
      .banner-container {
        border: 2px solid black;
      }
      .control-btn {
        padding: 20px;
        background-color: none;
        border: none;
        font-size: 20px;
      }

      /* 4단계 : 세부조정 */
      .image-wrapper img {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease-in-out;
      }

      .image-wrapper img.active {
        opacity: 1;
        visibility: visible;
      }

      .control-btn {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .control-btn:hover {
        transform: scale(1.3);
      }

      /* 5단계 : 반응형 처리. */
    </style>
  </head>
  <body>
    <h1>ch16 index02.html 파일</h1>

    <div class="banner-container">
      <button class="control-btn prev-btn">&lt;</button>
      <div class="image-wrapper">
        <img class="active" src="https://picsum.photos/id/20/400/300" alt="" />
        <img src="https://picsum.photos/id/30/400/300" alt="" />
        <img src="https://picsum.photos/id/40/400/300" alt="" />
      </div>

      <button class="control-btn next-btn">&gt;</button>
    </div>

    <script>
      const prevButton = document.querySelector(".prev-btn");
      const nextButton = document.querySelector(".next-btn");
      const imageList = document.querySelectorAll(".image-wrapper img");

      // 상태변수 : 현재 보이는 이미지의 인덱스 , 화면은 항상 이 값을 따라간다.
      let currentIndex = 0;
      const imageCount = imageList.length;

      // 1. 이전 버튼 리스너 등록.
      prevButton.addEventListener("click", () => {
        let newIndex = (currentIndex - 1 + imageCount) % imageCount;
        updateBanner(newIndex);
      });

      // 2. 다음 버튼 리스너 등록.
      nextButton.addEventListener("click", () => {
        let newIndex = (currentIndex + 1) % imageCount;
        updateBanner(newIndex);
      });

      // 확인 : currentIndex가 0 , 1 , 2 일 때
      // 이전 : (0 - 1 + 3) % 3 = 2 , (1 - 1 + 3) % 3 = 0 , (2 - 1 + 3) % 3 = 1
      // 다음 : (0 + 1) % 3 = 2 , ...

      // 화면에 갱신은 이 함수가 무조건 처리하고 버튼의 인덱스만 계산.
      function updateBanner(newIndex) {
        // 화면갱신.
        // 1. 현재 활성화 된 img에서 active 클래스를 빼서 숨긴다.
        imageList[currentIndex].classList.remove("active");

        // 2. 상태변수를 새 인덱스 번호로 교체.
        currentIndex = newIndex;

        // 3. 새 인덱스의 img에 active클래스를 붙여서 보이게 함.
        imageList[currentIndex].classList.add("active");
      }
    </script>
  </body>
</html>
