<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      img {
        width: 120px;
      }
    </style>
  </head>
  <body>
    <h1>ch09 index04.html</h1>

    <h3>방법 1 : HTML속성에 직접 쓰기</h3>
    <div class="row">
      <img src="img1.png" alt="포토1" id="photo1" />
      <button onclick="togglePhoto1()">이미지 토글1</button>
      <button id="toggle-btn">이미지 토글2</button>
    </div>

    <script>
      let isFirst = true;

      function togglePhoto1() {
        const photoE1 = document.getElementById("photo1");
        if (isFirst) {
          photoE1.src = "img2.png";
        } else {
          photoE1.src = "img1.png";
        }
        isFirst = !isFirst;
      }

      console.log("방법 2 : addEventListener로 처리");
      document
        .getElementById("toggle-btn")
        .addEventListener("click", function () {
          const photoE1 = document.getElementById("photo1");

          if (isFirst) {
            photoE1.src = "img2.png";
          } else {
            photoE1.src = "img1.png";
          }
          isFirst = !isFirst;
        });
    </script>
  </body>
</html>
