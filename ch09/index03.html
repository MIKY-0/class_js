<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch09 index03.html</h1>
    <ul id="fruit-list">
      <li class="fruit">사과</li>
      <li class="fruit">바나나</li>
    </ul>

    <script>
      // 1. 같은 요소들을 두가지 방법으로 찾기.
      const liveList = document.getElementsByClassName("fruit"); // HTMLCollection --> 나중에 추가된 것이 실제 추가됨.
      const staticList = document.querySelectorAll(".fruit"); // NodeList --> 현재 이시점의 스냅샷이므로 나중에 추가해도 반영안되고 이상태로 유지.
      console.log("liveList.length : " + liveList.length);
      console.log("staticList.length : " + staticList.length);

      // 2. 새 요소를 추가해보기.
      const newFruit = document.createElement("li"); // newFruit에 li태그 만듦.
      console.log(newFruit);
      newFruit.className = "fruit"; // 이 태그에 class 'fruit' 넣기.
      newFruit.textContent = "포도"; // 이 태그 내용에 '포도'넣기
      // 여기까진 실제 dom에 추가된게 아님.

      // 아래 코드가 실제 dom에 추가하는 코드.
      document.getElementById("fruit-list").append(newFruit); // 실제 Html 문서에 포도가 등록됨.

      // 3. 추가한 뒤 두 결과의 개수를 다시 확인해보기.
      console.log("liveList.length : " + liveList.length); // HTMLCollection이므로 추가됨.
      console.log("staticList.length : " + staticList.length); // NodeList이므로 반영안됨.

      // 4. 물론 동적으로 요소를 추가한 뒤 다시 길이를 확인하면 반영됨. 현재 결과를 다시 스냅샷으로 찍음.
      console.log("요소 추가한뒤 스냅샷 다시찍음 : " + document.querySelectorAll(".fruit").length);
    </script>
  </body>
</html>
