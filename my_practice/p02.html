    <!-- -------------- 13 -------------- -->
    <script>
      const orderList = [
        { id: 1, customer: "민수", amount: 40000, member: false },
        { id: 2, customer: "지수", amount: 90000, member: true },
        { id: 3, customer: "철수", amount: 150000, member: true },
        { id: 4, customer: "영희", amount: 60000, member: false },
      ];

      const paymentSystem = {
        orders: orderList,
        results: [],
        totalPay: 0,
        orderCount: 0,
        getResult(callback) {
          for (const o of this.orders) {
            const a = callback(o);
            if (a <= 50000) continue;

            this.results.push({
              customer: o.customer,
              originalPrice: o.amount,
              finalPrice: a,
            });
            this.totalPay += a;
            this.orderCount++;
          }
        },
        getOrder(o) {
          if (o.member && o.amount >= 100000) return o.amount * 0.8;
          else if (o.member && o.amount < 100000) return o.amount * 0.9;
          else if (!o.member) return o.amount;
        },
      };

      paymentSystem.getResult(paymentSystem.getOrder);
      console.log(paymentSystem.results);
      console.log(paymentSystem.totalPay);
      console.log(paymentSystem.orderCount);
    </script>
