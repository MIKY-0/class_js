    <script>
      const productList = [
        { id: 1, name: "키보드", price: 50000 },
        { id: 2, name: "마우스", price: 30000 },
        { id: 3, name: "모니터", price: 200000 },
        { id: 4, name: "USB", price: 15000 },
      ];

      const couponInfo = { type: "percent", value: 10 };

      const shop = {
        products: productList,
        lastName: null,
        lastPrice: 0,
        isPurchase: false,
        aa(id, info, callback) {
          let product = null;
          for (const p of this.products) {
            if (p.id === id) {
              product = p;
              // callback(p, couponInfo);
              this.lastName = p.name;
              this.lastPrice = callback(p, couponInfo);
              this.isPurchase = true;
            }
          }

          if (product === null) {
            this.lastName = null;
            this.lastPrice = 0;
            this.isPurchase = false;
          }
        },
      };

      const bb = (p, c) => {
        if (c.type === "percent") return p.price - (p.price * c.value) / 100;
        else if (c.type === "fixed") return p.price - c.value;
      };

      shop.aa(1, couponInfo, bb);
      console.log(shop.lastName);
      console.log(shop.lastPrice);
      console.log(shop.isPurchase);
    </script>
