<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index01.html 파일</h1>

    <script>
      // 1. let : 변경 가능한 값을 담는 상자.
      let username = "홍길동"; // username에 홍길동이라는 문자열 값을 담는다.
      console.log("1 : " + username);

      username = "티모"; // 상자안 값 변경가능.
      console.log("2 : " + username);

      // 2. const : 상수(변경 불가)
      const PI = 3.14;
      console.log("3 : " + PI);

      // 2 - 1. --> 콘솔창에 에러.  변경 불가한데 변경 시도하였기 때문.
      // PI = 3.141592;

      // 3. 같은 변수 선언시. 오류 발생.
      //let username = "다른사람;"

      // 4. 변할 수 있는 같은 상자에 다른 종류의 값을 넣을 수 있음.
      let anything = 100; // 이시점에는 number 타입으로 상자가 결정됨.
      anything = "이제는 문자열";
      console.log("4 : " + anything);
    </script>
  </body>
</html>
