<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index02.html</h1>

    <script>
      // 1. 자주 쓰는 자료형 3가지
      let age = 25; // number(정수 , 소수 구분 없음)
      let nickname = "홍길동"; // String
      let isDevelopper = true; // boolean

      // 2. "값이 없음"을 의미하는 2가지.
      let emptyBox; // --> undefined 상자는 만들고 아무것도 안넣은 상태.
      let nothing = null; // 개발자가 일부러 비워둔다고 직접 넣는값.

      // 3. typeof로 타입을 확인.
      console.log("age : " + typeof age);
      console.log("nickname : " + typeof nickname);
      console.log("isDeveloper : " + typeof isDevelopper);
      console.log("emptyBox : " + typeof emptyBox);
      console.log("nothing : " + typeof nothing); // null값은 Object타입으로 반환됨.
      console.log("10 : " + typeof 10); // 정수든 소수든 number로 출력.
      console.log("10.11111 : " + typeof 10.11111);

      // 궁금한점 : 변수안에 들어간 값이 null인지 여부를 확인하고 싶다면?
      console.log(nothing === null);
    </script>
  </body>
</html>
