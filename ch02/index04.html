<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index04.html</h1>

    <script>
      console.log("----------------1. 자동형변환----------------");
      console.log("100 + 2 = " + (100 + 2));
      console.log("100 + '2' = " + (100 + "2")); // 숫자 + 문자열은 자동으로 숫자 -> 문자열로 변환.
      console.log("100 * '2' = " + 100 * "2"); // 곱셈은 문자 -> 숫자로 변환.
      console.log("100 - '2' = " + (100 - "2")); // 빼기 연산도 문자 -> 숫자로 변환.
      console.log("100 / '2' = " + 100 / "2"); // 나누기 연산도 문자 -> 숫자로 변환.
      console.log("100 % '2' = " + (100 % "2")); // 나머지 연산도 문자 -> 숫자로 변환.
      console.log("100 * 'abc' = " + 100 * "abc"); // 숫자로 바꿀수 없는 문자열은 NaN 출력.
      console.log("100 + 'abc' = " + (100 + "abc")); // 더하기연산은 이어 붙임.

      console.log("----------------2. 수동형변환(문자 -> 숫자)----------------");
      let priceText = "123";
      let price = Number(priceText);
      console.log("typeof priceText : " + typeof priceText);
      console.log("typeof price : " + typeof price);
      console.log("price + 100 = " + (price + 100));

      // 숫자로 바꿀 수 없는 문자를 바꾸면 NaN(Not a Number).
      console.log("Number('abc') : " + Number("abc"));

      // 주의할 점 : 만약 빈 문자열을 숫자로 형변환 하면?
      console.log("Number('') : " + Number("")); // 즉, 빈 문자열은 0이 됨.

      console.log("----------------3. 수동형변환(숫자 -> 문자)----------------");
      let count = 456;
      let countText = String(count);
      console.log("typeof countText : " + typeof countText);
      console.log(countText + "개 입니다");

      console.log("----------------4. 입력값은 항상 문자열. ----------------");
      let input1 = "10";
      let input2 = "20";
      console.log("input1 + input2 = " + input1 + input2);
      console.log("Number(input1) + Number(input2) : " + (Number(input1) + Number(input2)));
    </script>
  </body>
</html>
