<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index03.html</h1>

    <script>
      console.log("------------------1. 산술연산자------------------");
      let a = 10;
      let b = 3;
      console.log("a + b = " + (a + b));
      console.log("a - b = " + (a - b));
      console.log("a * b = " + a * b);
      console.log("a / b = " + a / b);
      console.log("a % b = " + (a % b));

      console.log("------------------2. 할당연산자------------------");
      let point = 100;

      point += 50;
      console.log("point += 50 : " + point);

      point -= 30;
      console.log("point -= 30 : " + point);

      point++; // 1증가.
      console.log("point++ : " + point);

      point--; // 1감소.
      console.log("point-- : " + point);

      console.log("------------------3. 비교연산자------------------");
      console.log("10 > 5 : " + (10 > 5));
      console.log("10 <= 5 : " + (10 <= 5));
      console.log("10 == '10' : " + (10 == "10"));
      console.log("10 === '10' : " + (10 === "10"));

      // 부정형도 마찬가지
      console.log("10 != '10' : " + (10 != "10")); // 값이 같은지 확인.
      console.log("10 !== '10' : " + (10 !== "10")); // 타입,값이 같은지 확인.

      console.log("------------------4. 논리연산자------------------");
      console.log("true && false : " + (true && false));
      console.log("true || false : " + (true || false));
      console.log(!false); // 뒤집기

      console.log("------------------5. 연산자 우선순위------------------");
      // 곱하기 / 나누기가 더하기 / 빼기보다 먼저 계산.
      console.log("2 + 3 * 4 = " + (2 + 3 * 4)); // 헷갈리면 소괄호 사용. 괄호 안이 항상 먼저.
      console.log("(2 + 3) * 4 = " + (2 + 3) * 4);
    </script>
  </body>
</html>
