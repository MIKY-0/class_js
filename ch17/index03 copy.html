<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index03.html 파일</h1>
    <input type="text" value="소주" style="padding: 4px" id="orderInput" />
    <button id="orderButton">주문 시작</button>
    <p
      id="noticeBoard"
      style="padding: 50px; border: 1px solid #ccc; text-align: center"
    >
      주문을 기다리고 있습니다.
    </p>

    <script>
      const orderButton = document.getElementById("orderButton");
      const orderInput = document.getElementById("orderInput");
      const noticeBoard = document.getElementById("noticeBoard");

      function orderCoffe(o) {
        return new Promise(function (rs, rj) {
          setTimeout(function () {
            if (o === "아메리카노" || o === "라떼") {
              rs(o + "주문");
            } else {
              rj(o + "는 안팝니다");
            }
          });
        });
      }

      orderButton.addEventListener("click", () => {
        orderCoffe(orderInput.value)
          .then((msg) => {
            console.log(msg);
            noticeBoard.textContent = msg;
          })
          .catch((e) => {
            console.log(e);
            noticeBoard.textContent = e;
          });
      });
    </script>
  </body>
</html>
