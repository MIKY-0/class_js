<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index04.html 파일</h1>
    <input type="text" value="소주" style="padding: 4px" id="orderInput" />
    <button id="orderButton">주문 시작</button>
    <p
      id="noticeBoard"
      style="padding: 50px; border: 1px solid #ccc; text-align: center"
    >
      주문을 기다리고 있습니다.
    </p>

    <script>
      const orderButton = document.getElementById("orderButton");
      const orderInput = document.getElementById("orderInput");
      const noticeBoard = document.getElementById("noticeBoard");

      // 함수 선언문 - 주문을 받아서 Promise를 돌려줌.
      function orderCoffee(order) {
        return new Promise(function (resolve, reject) {
          // 이름은 상관없지만 순서는 중요.
          // 이 안에는 시간이 걸리는 작업을 적음. 여기서는 3초 타이머로 흉내만 냄.
          setTimeout(function () {
            // 3초뒤 응답이 왔을때 실행할 일 설계.
            if (order === "아메리카노" || order === "라떼") {
              resolve(order + "가 나왔습니다."); // resolve : 성공(이행 상태로 바꾸고 값을 전달.)
            } else {
              reject("죄송 : " + order + "은 판매하지 않습니다."); // reject : 실패(거부 상태로 바꾸고 이유전달.)
            }
          }, 3000);
        });
      }

      // 규칙 1. await를 사용하려면 함수에 async 붙여야함.
      // orderButton.addEventListener("click", async () => {
      //   console.log("111111111111111");
      //   await orderCoffee(orderInput.value);
      //   console.log("22222222222222222");
      // });

      // 규칙 2. try문에서 reject가 발생하면 그 뒤 코드는 즉시 멈추고 바로 catch절로.
      orderButton.addEventListener("click", async () => {
        try {
          console.log("111111111111111");
          const message = await orderCoffee(orderInput.value);
          noticeBoard.textContent = message;

          console.log("22222222222222222");
        } catch (error) {
          noticeBoard.textContent = error;

          console.log("3333333333333333");
        }
      });
    </script>
  </body>
</html>
