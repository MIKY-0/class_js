<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch06 - index02.html</h1>

    <script>
      const timer = {
        seconds: 3,
        label: "요리 타이머",
        start: function () {
          console.log(this.label + "시작 " + this.seconds + "초"); // 여기 this --> timer
          setTimeout(function () {
            console.log(this.label + " :  요리 끝"); // 여기 this --> window가리킴.
          }, 3000);
        },
      };

      timer.start();
      // 이 메서드 안에 있는 콜백함수에서 사용하고 있는 this는 window를 가리킴.

      console.log("3. forEach에서도 같은 일이 발생.");
      const shop = {
        name2: "코딩상점", // name2로 바꾸면 this들은 undefined
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          this.products.forEach(function (p) {
            // 여기 this --> shop가리킴.
            console.log(this.name2 + " - " + p); // 여기 this --> window가리킴.
          });
        },
      };

      shop.printAll();

      console.log("4. 옛날 방식에 해결 : this를 다른 변수에 담아두기.");
      const shop2 = {
        name2: "코딩상점",
        products: ["마우스", "키보드", "모니터"],
        printAll: function () {
          const self = this; // 메서드 안에서 this가 shop2일때 변수에 담아둔다.
          this.products.forEach(function (p) {
            // 여기 this --> shop가리킴.

            console.log(self.name2 + " - " + p); // 여기 this --> window가리킴.
          });
        },
      };

      shop2.printAll();
    </script>
  </body>
</html>
