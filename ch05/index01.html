<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch05 - index01.html</h1>

    <script>
      // 1. 함수 선언문(매개변수)
      function addNumber(a, b) {
        const sum = a + b;
        return sum; // return : 나를 호출한 쪽에 결과를 밖으로 돌려주고 함수 종료.
      }

      // 2. 함수 호출(인수)
      const result = addNumber(10, 20);
      console.log(result);

      // 3. 생성자 함수랑 어떤 차이가 있는가?
      function Person(firstName, lastName) {
        this.firstName = firstName;
        this.lastName = lastName;
      }

      // 데이터 타입 typeof
      console.log(typeof addNumber); // function
      console.log(typeof Person); // function

      // 즉, 함수 선언문 , 생성자 함수는 같은 타입으로 취급.
      // 단, 다른점은 호출하는 방법일 뿐.
      const sum = addNumber(10, 20); // 그냥 호출 -> return
      const person1 = new Person("길동", "홍"); // new를 붙여 호출. --> 새 객체 생성.
      console.log(sum);
      console.log(person1);

      // 4. 실험1. 함수 선언문에 return 키워드가 없는데 대입연산자 사용하면?
      function sayHello(name) {
        console.log(name + "입니다");
      }
      const returned = sayHello("홍길동");
      console.log(returned);

      // 5. 실험2. return 키워드가 2개라면?
      function checkAge(age) {
        if (age < 0) {
          return "잘못된 나이";
          // return 키워드 만나는 순간 함수 종료.
        } else {
          return age + "세";
        }
        console.log("여기 찍힐까?");
      }

      console.log(checkAge(-5));
      console.log(checkAge(25));

      // 7. 매개변수에 기본값을 설정할 수 있음.
      function greet(name = "손님") {
        console.log(name + "님 환영합니다");
      }

      greet();
      greet("이순신");
    </script>
  </body>
</html>
