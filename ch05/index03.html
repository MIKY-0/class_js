  <body>
    <h1>ch05 - index03.html</h1>

    <script>
      console.log("1. 함수 표현식을 화살표 함수로");

      const addOld = function (x, y) {
        return x + y;
      };

      const addNew = (x, y) => {
        return x + y;
      };

      const addNew2 = (x, y) => x + y;

      console.log("2. 함수 표현식을 화살표 함수로");

      // 2 - 1. 몸체 전체가 return 한줄이면 중괄호와 return 생략가능.
      const substract = (n1, n2) => n1 - n2;
      console.log(substract(100, 10));

      // 2 - 2. 매개변수가 하나면 괄호도 생략 가능.
      const resultDouble = (n) => n * 2;

      // 2 - 3. 매개변수 없으면 빈 괄호만 사용 가능.
      const getRandom = () => Math.random();
      console.log(getRandom());

      // 2 - 4. 여러 줄이라면 중괄호와 return 키워드 그대로 사용.
      const calculateTotal = (price, count) => {
        const subTotal = price * count;
        const tax = subTotal * 0.1;
        return subTotal + tax;
      };

      console.log(calculateTotal(1000, 3));

      // 3. 주의) 객체를 한 줄로 돌려줄 때는 소괄호로 감싼다.
      const makeUser = (name) => ({ name: name, ative: true });
      console.log(makeUser("홍길동"));
    </script>
